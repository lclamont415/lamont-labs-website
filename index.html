<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lamont Labs</title>
<meta name="description" content="Lamont Labs. Independent work by Lindsay Lamont.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 148 123'%3E%3Cpath d='M99.4 0 49.2 122.9H0L42.8 18.1H23.1V0Z' fill='%230F8A5F'/%3E%3Cpath d='M147.5 65.3c-9.4 41-41.6 57.1-91.3 57.1 9.4-41 48.2-57.1 91.3-57.1Z' fill='%230F8A5F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F1EB;
    --ink: #1B1B18;
    --mute: #7C7A72;
    --line: #DAD7CF;
    --green: #0F8A5F;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 0.8125rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--paper);
    -webkit-font-smoothing: antialiased;
    padding-inline: clamp(1.25rem, 5vw, 4.5rem);
  }
  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--mute); }
  a:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

  .page {
    min-height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-block: 3.5rem 1.25rem;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 1.1rem; flex-wrap: wrap; }
  .wordmark {
    font-weight: 700;
    font-size: 0.8125rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  .byline { color: var(--mute); font-size: 0.75rem; }

  .mark {
    width: 18px; height: 15px;
    display: block;
    color: var(--green);
    flex: none;
    position: relative;
    top: 2px;
  }

  main {
    display: flex;
    align-items: center;
    padding-block: 4rem;
  }
  h1 {
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: 1.2rem;
    line-height: 1.4;
    letter-spacing: 0;
    max-width: 30ch;
    text-wrap: balance;
    font-variation-settings: 'opsz' 48;
  }

  footer {
    padding-block: 1.25rem 3.5rem;
    border-top: 1px solid var(--line);
    display: grid;
    gap: 0.35rem;
  }
  .label {
    font-size: 0.625rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--green);
  }

  ::selection { background: var(--green); color: var(--paper); }

  @media (max-width: 480px) {
    header { padding-block: 2rem 1rem; }
    footer { padding-block: 1rem 2rem; }
    main { padding-block: 3rem; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <div class="brand">
      <span class="wordmark">Lamont Labs</span>
      <span class="byline">Independent work by Lindsay Lamont</span>
    </div>
    <svg class="mark" viewBox="0 0 148 123" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M99.3819 0L49.1887 122.871H0L42.8111 18.0699H23.0984V0H99.3819Z"/>
      <path d="M147.481 65.272C138.044 106.242 105.907 122.369 56.2106 122.369C65.6475 81.3981 104.401 65.272 147.481 65.272Z"/>
    </svg>
  </header>

  <main>
    <h1>I take ambitious ideas and build them into real things.</h1>
  </main>

  <footer>
    <span class="label">Inquiries</span>
    <a href="mailto:lindsay@lamont-labs.com">lindsay@lamont-labs.com</a>
  </footer>

</div>
</body>
</html>
